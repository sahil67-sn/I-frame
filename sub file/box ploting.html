<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 100vh;
            width: 80%;
            background-color: teal;
            margin: auto;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            background-color: skyblue;
        }
        .box1{
            height: 80%;
            width: 80%;
            background-color: blue;
            border: 40px solid navy;
            margin: 55px 20px 30px 75px;
            padding: 70px 10px 20px 100px;
        }
        .box2{
            height: 80%;
            width: 80%;
            background-color:orange;
            text-align: center;
            line-height: 170px;
            color: white;
            font-size: 40px;
        }
        h2{
            text-align: center;
            line-height: 160px;
        }
        .margin{
            position: absolute;
            top: 26.5%;
            left: 47%;
            color: white;
        }
        .border{
            position: absolute;
            top: 33%;
            left: 47.1%;
            color: white;
        }
        .padding{
            position: absolute;
            top: 40%;
            left: 47%;
            color: white;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1 align="center" style="margin-top: 30px;">Box ploting</h1>
    <div class="con">
        <div class="box">
            <p class="margin">Margin</p>
            <div class="box1">
                <p class="border">Border</p>
                <p class="padding">Padding</p>
                <div class="box2">Context</div>
            </div>
        </div>
    </div>
</body>
</html>
