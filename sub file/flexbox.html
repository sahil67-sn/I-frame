<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 100vh;
            border: 1px solid black;
        }
        .header{
            height: 25%;
            border: 1px solid black;
            background-color: aqua;
        }
        .footer{
            height: 25%;
            border: 1px solid black;
            background-color: rgb(16, 70, 70);
        }
        .center{
            height: 50%;
            /* border: 1px solid black; */
            background-color: blueviolet;
            display: flex;
        }
        .left{
            width: 40%;
            border: 1px solid black;
            background-color: rgb(24, 121, 201);
        }
        .right{
            /* height: 100%; */
            width: 60%;
            background-color: rgb(43, 190, 27);
        }
        .top{
            height: 50%;
            width: 100%;
            background-color: beige;
            border: 1px solid black;
        }
        .bottom{
            height: 50%;
            background-color: brown;
            /* border: 1px solid black; */
            display: flex;
        }
        .b1{
            
            height: 100%;
            width: 50%;
            border: 1px solid black;
            background-color: rgb(105, 65, 65);
        }
        .b2{
            height: 100%;
            width: 50%;
            border: 1px solid black;
            background-color: rgb(85, 163, 173);
        }
        *{
            text-transform: capitalize;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-align: center;
            align-content: center;
        }
    </style>
</head>
<body>
    <h1 align="center">Flex Box</h1>
    <div class="con">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="b1"></div>
                    <div class="b2"></div>
                </div>
            </div>
        </div>
        <!-- <div class="bottom"></div> -->
        <div class="footer"></div>
        
    </div>
</body>
</html>
