<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        .con{
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            display: flex;
            border-radius: 40px;
            box-shadow: 10px 10px 10px gray;
        }
        .left,.right,.center{
            height: 100%;
        }
        .left{
            width: 2%;
            background-color: navy;
            border-radius: 30px;
        }
        .center{
            width: 63%;
            font-size: 60px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: navy;
            box-shadow: 5px;
            background-color: whitesmoke;
        }
        *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        }
        .right{
            width: 35%;
            background-color: white;
            border-radius: 50px;
        }
        .top{
            height: 30%;
        }
        .bottom{
            padding-top: 10px;
            height: 70%;
        }
        .top-in{
            height: 90%;
            background-color: navy;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
        }
        .circle{
            height: 120px;
            width: 120px;
            border: 4px solid navy;
            border-radius: 70px;
            position: absolute;
            top: 21%;
            right: 19.5%;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 4px solid white;
        }
        .bottom>h1,h2,h3{
            padding-top: 10px;
            text-align: center;
        }
        .icon,.last{
            height: 20%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .button{
            height: 20%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .sub{
            height: 50%;
            width: 40%;
            border: 1px solid black;
            background-color: navy;
            border-radius: 40px;
            text-align: center;
            color: azure;
            padding-top: 5px;
        }
        .fa-facebook{
            color: blue;
        }
         .fa-instagram{
            color: transparent;
            background: linear-gradient(red, orange);
            background-clip: text;
        }
        .fa-linkedin{
            color: blue;
        }
        .fa-github{
            color: violet ;
        }
        .fa-behance{
            color: green;
        }
    </style>
</head>
<body>
    <h1 align="center" style="margin-top: 1%;">UI/UX</h1>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="images/capture1.JPG" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Website Developer</h1>
                    <h2>Dezyne École College</h2>
                    <h3>BCA 1<sup>st</sup> Year</h3>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-github fa-2x"></i>          
                        <i class="fa fa-brands fa-linkedin fa-2x"></i>
                        <i class="fa fa-brands fa-behance fa-2x"></i>
                    </div>
                    <div class="button">
                        <div class="sub">Subscribe</div>
                        <div class="sub">Message</div>
                    </div>
                    <div class="last">
                        <i class="fa fa-solid fa-heart fa-1x"></i>60.4K
                        <i class="fa fa-solid fa-comment fa-1x"></i>20K
                        <i class="fa fa-solid fa-share fa-flip-horizontal fa-1x"></i>12.6K
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
